<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>downloaderV Soporte</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#150D26">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&amp;display=swap" rel="stylesheet">

<style>:root{--pk:#E91E63;--pk2:#FF4D8D;--vi:#7C3AED;--in:#1B1426;--st:#150D26;--bg:#F7F3F7;--ln:#ECE3EB;--mu:#7A7088;--ok:#12B76A;--am:#F59E0B;--f:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:var(--f);color:var(--in);background:var(--st);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pn{height:100dvh}
.pn>section{display:none;height:100%}
.pn[data-vista="cargando"] .pn-splash,.pn[data-vista="login"] .pn-login,.pn[data-vista="denegado"] .pn-denegado{display:grid;place-items:center}
.pn[data-vista="app"] .pn-app{display:grid}

/* Cargando y entrar */
.pn-splash{gap:18px;align-content:center;background:radial-gradient(80% 60% at 20% 0%,rgba(233,30,99,.35),transparent 60%),radial-gradient(70% 60% at 100% 10%,rgba(124,58,237,.35),transparent 60%),var(--st)}
.pn-splash img{border-radius:22px;box-shadow:0 20px 50px -18px rgba(233,30,99,.8)}
.pn-spin{display:inline-block;width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:giro .8s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
.pn-login,.pn-denegado{padding:20px;background:radial-gradient(80% 60% at 15% 0%,rgba(233,30,99,.4),transparent 60%),radial-gradient(70% 60% at 100% 15%,rgba(124,58,237,.4),transparent 60%),var(--st)}
.pn-login-card{width:min(420px,100%);padding:34px 28px 26px;border-radius:28px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 40px 80px -30px rgba(0,0,0,.6);text-align:center;color:#fff;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.pn-login-logo{border-radius:24px;box-shadow:0 20px 44px -16px rgba(233,30,99,.9)}
.pn-login-card h1{margin:18px 0 8px;font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.pn-login-card h1 span{background:linear-gradient(100deg,#FF5C8A,#C026D3 60%,#8B5CF6);-webkit-background-clip:text;background-clip:text;color:transparent}
.pn-login-card p{margin:0 auto 22px;max-width:28em;color:rgba(255,255,255,.72);line-height:1.5}
.pn-google{display:inline-flex;align-items:center;justify-content:center;gap:12px;width:100%;height:52px;border:0;border-radius:16px;background:#fff;color:var(--in);font-weight:700;font-size:1rem;box-shadow:0 12px 30px -12px rgba(0,0,0,.5);transition:transform .15s}
.pn-google:hover{transform:translateY(-1px)}
.pn-google svg{width:22px;height:22px;stroke:none}
.pn-login-note{margin:16px 0 0!important;font-size:.84rem}
.pn-login-note.mal{color:#FFB4C6!important}

</style>
</head>
<body>
<div class="pn" id="pn" data-vista="cargando">
  <!-- Cargando -->
  <section class="pn-splash">
    <img src="../icono.png" alt="" width="72" height="72">
    <span class="pn-spin"></span>
  </section>
  <!-- Entrar -->
  <section class="pn-login">
    <div class="pn-login-card">
      <img class="pn-login-logo" src="../icono.png" alt="" width="84" height="84">
      <h1>downloaderV <span>Soporte</span></h1>
      <p>Panel privado del equipo Trollana para responder a los usuarios en directo.</p>
      <button type="button" class="pn-google" id="pnEntrar">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Entrar con Google
      </button>
      <p class="pn-login-note" id="pnLoginNota">Acceso privado.</p>
    </div>
  </section>
  <section class="pn-denegado">
    <div class="pn-login-card">
      <img class="pn-login-logo" src="../icono.png" alt="" width="84" height="84">
      <h1>Esta cuenta no tiene acceso</h1>
      <p id="pnDenegadoT">Entra con la cuenta de soporte de downloaderV.</p>
      <button type="button" class="pn-google" id="pnCambiar">Cambiar de cuenta</button>
    </div>
  </section>
</div>
<script type="module">
// Puerta del panel. Aquí no hay nada del panel: su código y su diseño están
// guardados en la base de datos, y solo la cuenta autorizada puede leerlos.
import { SOPORTE } from '/soporte-config.js';
// Nunca dentro de otra web (evita trucos para que pulses algo sin darte cuenta)
if (window.top !== window.self) { document.body.innerHTML = ''; throw new Error('marco'); }
const CDN = 'https://www.gstatic.com/firebasejs/10.12.2/';
const [A, U, F] = await Promise.all([import(CDN + 'firebase-app.js'), import(CDN + 'firebase-auth.js'), import(CDN + 'firebase-firestore.js')]);
const app = A.getApps().find((a) => a.name === 'panel') || A.initializeApp(SOPORTE.firebase, 'panel');
const auth = U.getAuth(app), db = F.getFirestore(app);
const $ = (s) => document.querySelector(s), pn = $('#pn');
const vista = (v) => { pn.dataset.vista = v; };
let abierto = false, mostrandoDenegado = false;
const parar = U.onAuthStateChanged(auth, async (u) => {
  if (abierto) return;
  if (!u) { if (!mostrandoDenegado) vista('login'); return; }
  mostrandoDenegado = false;
  vista('cargando');
  let d = null, denegado = false;
  if (u.emailVerified && (u.providerData || []).some((p) => p.providerId === 'google.com')) {
    try { const s = await F.getDoc(F.doc(db, 'soporte_admin_app', 'panel')); d = s.exists() ? s.data() : null; }
    catch (e) { d = null; denegado = !!(e && e.code === 'permission-denied'); }
  } else denegado = true;
  if (!d || typeof d.js !== 'string') {
    $('#pnDenegadoT').textContent = `Has entrado como ${u.email || 'una cuenta sin correo'}. Esta cuenta no tiene permiso.`;
    vista('denegado'); mostrandoDenegado = true;
    // Una cuenta sin permiso no se queda guardada en el proyecto (ni su correo)
    if (denegado) { try { await U.deleteUser(u); } catch (_) { try { await U.signOut(auth); } catch (__) {} } }
    return;
  }
  abierto = true; parar();
  const st = document.createElement('style'); st.textContent = d.css; document.head.appendChild(st);
  document.body.innerHTML = d.html;
  const codigo = d.js.split('__ORIGEN__').join(location.origin);
  await import(URL.createObjectURL(new Blob([codigo], { type: 'text/javascript' })));
});
async function entrar() {
  const prov = new U.GoogleAuthProvider();
  prov.setCustomParameters({ prompt: 'select_account' });
  try { await U.signInWithPopup(auth, prov); }
  catch (e) {
    const c = e && e.code;
    if (c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-this-environment') return U.signInWithRedirect(auth, prov);
    if (c !== 'auth/popup-closed-by-user' && c !== 'auth/cancelled-popup-request') { const n = $('#pnLoginNota'); n.textContent = 'No se pudo entrar. Inténtalo otra vez.'; n.classList.add('mal'); }
  }
}
$('#pnEntrar').addEventListener('click', entrar);
$('#pnCambiar').addEventListener('click', async () => { mostrandoDenegado = false; try { await U.signOut(auth); } catch (_) {} entrar(); });
</script>
</body>
</html>
